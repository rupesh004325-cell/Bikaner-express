
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bikaner Express Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff8ee;
      color: #292321;
      margin: 0;
      padding: 16px;
    }
    header, .card {
      background: white;
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 14px;
      overflow-wrap: anywhere;
    }
    header {
      background: #a82420;
      color: white;
      text-align: center;
    }
    h2 { color: #a82420; }
    input, button, select {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      background: #a82420;
      color: white;
      border: 0;
    }
    .order {
      border-top: 1px solid #ddd;
      padding: 12px 0;
    }
    .muted { color: #6e625a; }
    #dashboard { display: none; }
    #message, #loginMessage { white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <h1>🏪 Bikaner Express</h1>
    <p>Admin Dashboard</p>
  </header>

  <section class="card" id="loginBox">
    <h2>Admin Login</h2>
    <form id="loginForm">
      <label for="email">Admin Email</label>
      <input id="email" type="email" required>
      <label for="password">Password</label>
      <input id="password" type="password" required>
      <button type="submit">Login</button>
    </form>
    <p id="loginMessage" class="muted"></p>
  </section>

  <main id="dashboard">
    <section class="card">
      <h2>📦 Orders</h2>
      <p>कुल ऑर्डर: <strong id="totalOrders">0</strong></p>
      <p>नए ऑर्डर: <strong id="newOrders">0</strong></p>
      <button id="refreshBtn">Refresh</button>
      <button id="logoutBtn">Logout</button>
      <p id="message" class="muted"></p>
    </section>
    <section class="card">
      <h2>🛒 Order Management</h2>
      <div id="ordersList">ऑर्डर लोड हो रहे हैं...</div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <script>
    "use strict";

    const ADMIN_UID = "i8dtxW327zN1onqskZ7MfK3QDcc2";

    const firebaseConfig = {
      apiKey: "AIzaSyDhumnH7lRnz_LVJLTMklksusBPaDAkCh4",
      authDomain: "bikaner-express-537a2.firebaseapp.com",
      databaseURL: "https://bikaner-express-537a2-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "bikaner-express-537a2",
      storageBucket: "bikaner-express-537a2.firebasestorage.app",
      messagingSenderId: "852964791053",
      appId: "1:852964791053:web:94c129e58b72a375661644",
      measurementId: "G-2J73RVKCGD"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const loginBox = document.getElementById("loginBox");
    const dashboard = document.getElementById("dashboard");
    const loginMessage = document.getElementById("loginMessage");
    const message = document.getElementById("message");
    const ordersList = document.getElementById("ordersList");

    let ordersRef = null;
    let ordersListener = null;

    function stopListener() {
      if (ordersRef && ordersListener) {
        ordersRef.off("value", ordersListener);
      }
      ordersRef = null;
      ordersListener = null;
    }

    function addText(parent, tag, value) {
      const el = document.createElement(tag);
      el.textContent = value;
      parent.appendChild(el);
      return el;
    }

    function renderOrders(snapshot) {
      ordersList.replaceChildren();
      const allOrders = [];
      const customers = snapshot.val() || {};

      Object.entries(customers).forEach(([uid, userOrders]) => {
        if (!userOrders || typeof userOrders !== "object") return;

        Object.entries(userOrders).forEach(([key, order]) => {
          if (order && typeof order === "object") {
            allOrders.push({
              ...order,
              _uid: uid,
              _key: key
            });
          }
        });
      });

      document.getElementById("totalOrders").textContent = allOrders.length;
      document.getElementById("newOrders").textContent =
        allOrders.filter(o => o.status === "New").length;

      if (!allOrders.length) {
        ordersList.textContent = "Abhi Firebase mein koi order nahi hai.";
        return;
      }

      allOrders.sort((a, b) =>
        String(b.createdAt || "").localeCompare(String(a.createdAt || ""))
      );

      allOrders.forEach(order => {
        const card = document.createElement("article");
        card.className = "order";

        addText(card, "h3", "Order ID: " + (order.id || order._key));
        addText(card, "p", "ग्राहक: " + (order.name || "N/A"));
        addText(card, "p", "मोबाइल: " + (order.phone || "N/A"));
        addText(card, "p", "पता: " + (order.address || "N/A"));

        const items = Array.isArray(order.items)
          ? order.items.map(item =>
              (item.name || "Item") + " × " +
              (item.quantity || 0) + " — ₹" + (item.subtotal || 0)
            ).join(", ")
          : "सामान की जानकारी नहीं है";

        addText(card, "p", "सामान: " + items);
        addText(card, "p", "कुल: ₹" + (order.total ?? 0));
        addText(card, "p", "दुकान: " + (order.shop || "N/A"));
        addText(card, "p", "स्थिति: " + (order.status || "New"));

        const select = document.createElement("select");
        const statuses = [
          "New", "Accepted", "Preparing",
          "Out for Delivery", "Delivered", "Cancelled"
        ];

        statuses.forEach(status => {
          const option = document.createElement("option");
          option.value = status;
          option.textContent = status;
          select.appendChild(option);
        });

        select.value = statuses.includes(order.status)
          ? order.status
          : "New";

        const updateBtn = document.createElement("button");
        updateBtn.textContent = "स्थिति Update करें";

        updateBtn.addEventListener("click", async () => {
          updateBtn.disabled = true;
          try {
            await db.ref("orders/" + order._uid + "/" + order._key)
              .update({ status: select.value });
            message.textContent = "स्थिति अपडेट हो गई।";
          } catch (error) {
            console.error(error);
            message.textContent = "Update नहीं हुआ। Rules जाँचें।";
          } finally {
            updateBtn.disabled = false;
          }
        });

        card.append(select, updateBtn);
        ordersList.appendChild(card);
      });
    }

    function startListener() {
      stopListener();
      ordersRef = db.ref("orders");

      ordersListener = snapshot => {
        renderOrders(snapshot);
        message.textContent = "Firebase से ऑर्डर लोड हो रहे हैं।";
      };

      ordersRef.on("value", ordersListener, error => {
        console.error(error);
        message.textContent = "ऑर्डर लोड नहीं हुए। Database Rules जाँचें।";
      });
    }

    document.getElementById("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      loginMessage.textContent = "Login हो रहा है...";

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const result = await auth.signInWithEmailAndPassword(email, password);

        if (result.user.uid !== ADMIN_UID) {
          await auth.signOut();
          loginMessage.textContent = "इस अकाउंट को Admin की अनुमति नहीं है।";
        } else {
          loginMessage.textContent = "";
        }
      } catch (error) {
        console.error(error);
        loginMessage.textContent = "Login नहीं हुआ। Email और password जाँचें।";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      stopListener();
      await auth.signOut();
    });

    document.getElementById("refreshBtn").addEventListener("click", startListener);

    auth.onAuthStateChanged(user => {
      stopListener();

      const isAdmin = !!user && user.uid === ADMIN_UID;
      loginBox.style.display = isAdmin ? "none" : "block";
      dashboard.style.display = isAdmin ? "block" : "none";

      if (isAdmin) {
        startListener();
      } else {
        ordersList.textContent = "Admin login karein.";
        document.getElementById("totalOrders").textContent = "0";
        document.getElementById("newOrders").textContent = "0";
      }
    });
  </script>
</body>
</html>
